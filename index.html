<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PinSnap</title>
<meta name="description" content="Projektfotos aufnehmen, Stellen mit Pins markieren und Detailfotos hinzufügen.">
<meta name="theme-color" content="#0B0C10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PinSnap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<div id="cam" class="cam" hidden></div>
<input type="file" id="camIn" class="sr" accept="image/*" capture="environment" aria-label="Foto mit System-Kamera aufnehmen">
<input type="file" id="galIn" class="sr" accept="image/*" aria-label="Foto aus Galerie wählen">
<script src="app.js"></script>
</body>
</html>
